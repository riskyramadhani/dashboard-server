services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: dashboard-server-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboard_server}
      POSTGRES_USER: ${POSTGRES_USER:-bss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bss_secret_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bss -d dashboard_server"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
